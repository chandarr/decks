<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KUKA at the Physical-AI Inflection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   THEME TOKENS — three selectable systems, all dark-bookend/light-middle
   A = Swiss Precision (default)  B = Clinical Warm  C = Swiss + cool secondary
   ============================================================ */
:root {
  --kuka:        #FF5800;   /* KUKA orange, single accent */
  --kuka-deep:   #E24E00;
  --kuka-glow:   rgba(255,88,0,0.55);

  /* light-middle tokens (Theme A default) */
  --canvas:      #FFFFFF;
  --block:       #F5F5F7;
  --panel:       #FFFFFF;
  --border:      #E4E4E8;
  --ink:         #111111;
  --secondary:   #86868B;
  --muted:       #A9A9AE;
  --accent:      var(--kuka);
  --secondary-data: #64748B;   /* used only by Theme C */

  /* dark-bookend tokens (shared) */
  --dark-0:      #0A0A0B;
  --dark-1:      #121214;
  --dark-ink:    #F4F4F5;
  --dark-sec:    #8B8B92;

  /* tier semantics */
  --tier-confirmed: var(--kuka);
  --tier-estimate:  #86868B;
  --tier-frontier:  #111111;

  --shadow-sm: 0 1px 3px rgba(0,0,0,.06);
  --shadow-md: 0 10px 30px -12px rgba(0,0,0,.18);
  --shadow-lg: 0 24px 60px -20px rgba(0,0,0,.22);

  --maxw: 1180px;
}

/* THEME B — Clinical Warm */
body[data-theme="B"] {
  --canvas: #FAF9F6;
  --block:  #F2F0EA;
  --panel:  #FFFFFF;
  --border: #E7E2D8;
  --ink:    #1A1A1A;
  --secondary: #6B6B6B;
  --muted:  #9A968C;
}

/* THEME C — Swiss + cool secondary data hue */
body[data-theme="C"] {
  --canvas: #FFFFFF;
  --block:  #F5F5F7;
  --secondary-data: #2F7FB8;
}

* { margin:0; padding:0; box-sizing:border-box; }

html, body { height:100%; }
body {
  font-family:'Inter',system-ui,sans-serif;
  background:var(--dark-0);
  color:var(--ink);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

/* ============================================================
   DECK STAGE
   ============================================================ */
#deck { position:fixed; inset:0; }

.screen {
  position:absolute; inset:0;
  display:flex; flex-direction:column;
  justify-content:center;
  padding:clamp(32px,5vw,88px);
  opacity:0; visibility:hidden;
  transition:opacity .5s ease, visibility .5s;
  background:var(--canvas);
  overflow:hidden;
}
.screen.active { opacity:1; visibility:visible; z-index:2; }
.screen.dark { background:radial-gradient(120% 120% at 50% 30%, var(--dark-1), var(--dark-0) 70%); color:var(--dark-ink); }

.inner { width:100%; max-width:var(--maxw); margin:0 auto; }

/* kicker / titles */
.kicker {
  font-family:'JetBrains Mono',monospace;
  font-size:clamp(10px,1vw,13px);
  letter-spacing:.22em; text-transform:uppercase;
  color:var(--secondary); margin-bottom:22px;
}
.dark .kicker { color:var(--kuka); }
.kicker .bar { color:var(--kuka); }

h1.title {
  font-family:'Space Grotesk',sans-serif;
  font-weight:600; line-height:1.04;
  letter-spacing:-.02em;
  font-size:clamp(30px,4.6vw,62px);
  margin-bottom:20px;
}
.subtitle {
  font-size:clamp(15px,1.7vw,22px);
  color:var(--secondary); font-weight:400;
  line-height:1.5; max-width:42ch; margin-bottom:8px;
}
.dark .subtitle { color:var(--dark-sec); }

.beatline {
  font-family:'Space Grotesk',sans-serif;
  font-size:clamp(15px,1.7vw,21px);
  font-weight:500; margin-top:30px; line-height:1.4;
}
.beatline b { color:var(--kuka); font-weight:600; }

/* number & data */
.big-num {
  font-family:'Space Grotesk',sans-serif;
  font-variant-numeric:tabular-nums;
  font-weight:700; letter-spacing:-.03em;
  color:var(--kuka); line-height:1;
}

/* tier chips */
.tier {
  display:inline-flex; align-items:center; gap:6px;
  font-family:'JetBrains Mono',monospace;
  font-size:10px; letter-spacing:.14em; text-transform:uppercase;
  padding:3px 9px; border-radius:100px; border:1px solid var(--border);
  color:var(--secondary); background:var(--panel);
}
.tier::before { content:""; width:6px; height:6px; border-radius:50%; }
.tier.confirmed::before { background:var(--kuka); }
.tier.estimate::before  { background:var(--muted); }
.tier.frontier::before  { background:var(--ink); }
.dark .tier { background:rgba(255,255,255,.05); border-color:rgba(255,255,255,.12); color:var(--dark-sec); }

/* generic reveal */
.step { opacity:0; transform:translateY(14px); transition:opacity .6s ease, transform .6s ease; }
.step.shown { opacity:1; transform:none; }

/* ============================================================
   CHROME — progress rail, controls, theme switch
   ============================================================ */
#rail {
  position:fixed; bottom:26px; left:50%; transform:translateX(-50%);
  display:flex; gap:8px; z-index:40;
}
#rail .dot {
  width:26px; height:3px; border-radius:2px;
  background:rgba(130,130,140,.32); cursor:pointer; transition:background .3s, width .3s;
}
#rail .dot.on { background:var(--kuka); width:34px; }
body.on-dark #rail .dot { background:rgba(255,255,255,.22); }
body.on-dark #rail .dot.on { background:var(--kuka); }

#counter {
  position:fixed; bottom:22px; right:30px; z-index:40;
  font-family:'JetBrains Mono',monospace; font-size:12px;
  color:var(--secondary); letter-spacing:.1em;
}
body.on-dark #counter { color:var(--dark-sec); }

#hint {
  position:fixed; bottom:22px; left:30px; z-index:40;
  font-family:'JetBrains Mono',monospace; font-size:11px;
  color:var(--muted); letter-spacing:.08em;
  transition:opacity .8s ease;
}
body.on-dark #hint { color:var(--dark-sec); }

/* theme switcher */
#themebar {
  position:fixed; top:22px; right:26px; z-index:50;
  display:flex; align-items:center; gap:10px;
  background:var(--panel); border:1px solid var(--border);
  padding:7px 10px; border-radius:100px; box-shadow:var(--shadow-sm);
}
body.on-dark #themebar { background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.14); backdrop-filter:blur(8px); }
#themebar .lab {
  font-family:'JetBrains Mono',monospace; font-size:10px;
  letter-spacing:.14em; text-transform:uppercase; color:var(--secondary);
}
body.on-dark #themebar .lab { color:var(--dark-sec); }
#themebar button {
  font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:500;
  width:24px; height:24px; border-radius:50%; cursor:pointer;
  border:1px solid var(--border); background:transparent; color:var(--secondary);
  transition:all .2s;
}
#themebar button.on { background:var(--kuka); color:#fff; border-color:var(--kuka); }
body.on-dark #themebar button { border-color:rgba(255,255,255,.2); color:var(--dark-sec); }
body.on-dark #themebar button.on { background:var(--kuka); color:#fff; border-color:var(--kuka); }

/* ============================================================
   COVER (screen 1) — animated arm
   ============================================================ */
.cover-wrap { display:flex; flex-direction:column; justify-content:center; align-items:flex-start; height:100%; position:relative; z-index:3; }
#arm-stage { position:absolute; inset:0; z-index:1; pointer-events:none; }
.cover-text { position:relative; z-index:3; }
.cover-text .kicker { opacity:0; transform:translateY(8px); }
.grid-bg { position:absolute; inset:0; z-index:0; opacity:.5;
  background-image:radial-gradient(circle at 1px 1px, rgba(255,255,255,.06) 1px, transparent 0);
  background-size:34px 34px; }

/* ============================================================
   SCREEN 3 — signal cards
   ============================================================ */
.sig-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:18px; margin-top:38px; }
.sig-card {
  background:var(--panel); border:1px solid var(--border); border-radius:16px;
  padding:26px 22px; box-shadow:var(--shadow-sm); min-height:210px;
  display:flex; flex-direction:column;
}
.sig-card .num { font-size:clamp(26px,3.2vw,42px); }
.sig-card .lab { font-size:13px; color:var(--secondary); margin-top:10px; line-height:1.45; flex:1; }
.sig-card .src { font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:.1em; color:var(--muted); text-transform:uppercase; margin-top:14px; }

/* ============================================================
   SCREEN 4 — competitive map
   ============================================================ */
.map-wrap { display:grid; grid-template-columns:1.35fr .9fr; gap:52px; align-items:center; margin-top:22px; padding-left:26px; padding-bottom:24px; }
.map-plot { position:relative; aspect-ratio:1/.82; border:1px solid var(--border); border-radius:16px; background:linear-gradient(180deg,var(--panel),var(--block)); box-shadow:var(--shadow-sm); }
.map-plot::before { content:""; position:absolute; left:0; right:0; top:50%; border-top:1px dashed var(--border); }
.map-plot::after { content:""; position:absolute; top:0; bottom:0; left:50%; border-left:1px dashed var(--border); }
.map-plot .axis-x, .map-plot .axis-y { position:absolute; font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); white-space:nowrap; }
.map-plot .axis-x { bottom:-22px; left:50%; transform:translateX(-50%); }
.map-plot .axis-y { top:50%; left:-14px; transform:translateY(-50%) rotate(-90deg); transform-origin:center; }
.node { position:absolute; transform:translate(-50%,-50%); text-align:center; opacity:0; transition:opacity .5s ease, transform .5s ease; }
.node .pill { font-size:12px; font-weight:600; padding:7px 12px; border-radius:100px; white-space:nowrap; border:1px solid var(--border); background:var(--panel); box-shadow:var(--shadow-sm); }
.node.kuka .pill { background:var(--kuka); color:#fff; border-color:var(--kuka); font-weight:700; box-shadow:0 6px 20px -6px var(--kuka-glow); }
.node.shown { opacity:1; }
.map-read { }
.map-read li { list-style:none; margin-bottom:18px; padding-left:16px; border-left:2px solid var(--border); }
.map-read li b { display:block; font-family:'Space Grotesk',sans-serif; font-size:15px; margin-bottom:3px; }
.map-read li span { font-size:13px; color:var(--secondary); line-height:1.45; }
.map-read li.hi { border-left-color:var(--kuka); }

/* ============================================================
   SCREEN 5 — SWOT
   ============================================================ */
.swot { display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:16px; margin-top:26px; }
.q { background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:24px 24px; box-shadow:var(--shadow-sm); }
.q h3 { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.16em; text-transform:uppercase; margin-bottom:14px; display:flex; align-items:center; gap:8px; }
.q h3::before { content:""; width:8px; height:8px; border-radius:2px; }
.q.s h3::before { background:var(--kuka); }
.q.w h3::before { background:#C15A3A; }
.q.o h3::before { background:#0E7C6B; }
.q.t h3::before { background:#111; }
.q ul { list-style:none; }
.q li { font-size:13.5px; line-height:1.5; margin-bottom:9px; padding-left:15px; position:relative; color:var(--ink); }
.q li::before { content:"—"; position:absolute; left:0; color:var(--muted); }
.q li b { font-weight:600; }

/* ============================================================
   SCREEN 6 — the paradox (split)
   ============================================================ */
.paradox { display:grid; grid-template-columns:1fr 1fr; gap:0; margin-top:20px; border:1px solid var(--border); border-radius:18px; overflow:hidden; box-shadow:var(--shadow-md); }
.paradox .side { padding:38px 36px; }
.paradox .left { background:var(--block); }
.paradox .right { background:var(--panel); border-left:1px solid var(--border); }
.paradox h3 { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--secondary); margin-bottom:24px; }
.metric { margin-bottom:26px; }
.metric .n { font-size:clamp(26px,3.4vw,44px); }
.metric .n.neg { color:#C15A3A; }
.metric .d { font-size:13px; color:var(--secondary); margin-top:4px; line-height:1.4; }
.paradox .right .n { color:#C15A3A; }

/* ============================================================
   SCREEN 7 — structural diagnosis
   ============================================================ */
.diag { display:grid; grid-template-columns:1fr 1fr; gap:34px; margin-top:26px; align-items:start; }
.diag .built, .diag .now { background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:30px 30px; box-shadow:var(--shadow-sm); }
.diag h3 { font-family:'Space Grotesk',sans-serif; font-size:17px; margin-bottom:16px; }
.diag .now { border-color:var(--kuka); box-shadow:0 10px 30px -14px var(--kuka-glow); }
.diag ul { list-style:none; }
.diag li { font-size:14px; line-height:1.55; margin-bottom:11px; padding-left:16px; position:relative; color:var(--secondary); }
.diag li::before { content:"→"; position:absolute; left:0; color:var(--kuka); }
.diag .now li { color:var(--ink); }
.diag-arrow { text-align:center; font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.1em; color:var(--muted); }

/* ============================================================
   SCREEN 8 — two additive layers
   ============================================================ */
.layers { display:grid; grid-template-columns:1fr 1fr; gap:44px; margin-top:24px; align-items:center; }
.layer-stack { display:flex; flex-direction:column; gap:14px; }
.layer-box { border-radius:16px; padding:28px 30px; position:relative; }
.layer-box.l1 { background:var(--block); border:1px solid var(--border); }
.layer-box.l2 { background:linear-gradient(135deg, var(--kuka), var(--kuka-deep)); color:#fff; box-shadow:0 20px 44px -18px var(--kuka-glow); }
.layer-box .tag { font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.14em; text-transform:uppercase; opacity:.7; margin-bottom:8px; }
.layer-box h3 { font-family:'Space Grotesk',sans-serif; font-size:19px; margin-bottom:6px; }
.layer-box p { font-size:13.5px; line-height:1.5; opacity:.92; }
.layer-copy p { font-size:15px; line-height:1.6; color:var(--secondary); margin-bottom:16px; }
.layer-copy p b { color:var(--ink); font-weight:600; }

/* ============================================================
   SCREEN 9 — flywheel
   ============================================================ */
.fly-wrap { display:grid; grid-template-columns:1fr .95fr; gap:40px; align-items:center; margin-top:14px; }
#fly-stage { position:relative; aspect-ratio:1/1; max-width:460px; margin:0 auto; width:100%; }
.fly-node { position:absolute; transform:translate(-50%,-50%); width:38%; text-align:center; opacity:0; transition:opacity .5s ease; }
.fly-node .box { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:12px 10px; box-shadow:var(--shadow-sm); }
.fly-node .box .t { font-size:12px; font-weight:600; line-height:1.25; }
.fly-node .box .s { font-size:10px; color:var(--secondary); margin-top:3px; }
.fly-node.shown { opacity:1; }
.fly-center { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:34%; aspect-ratio:1; border-radius:50%; background:linear-gradient(135deg,var(--kuka),var(--kuka-deep)); color:#fff; display:flex; align-items:center; justify-content:center; text-align:center; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13px; line-height:1.2; box-shadow:0 14px 40px -10px var(--kuka-glow); opacity:0; transition:opacity .6s; padding:10px; }
.fly-center.shown { opacity:1; }
.fly-read p { font-size:15px; line-height:1.6; color:var(--secondary); margin-bottom:16px; }
.fly-read p b { color:var(--ink); font-weight:600; }
.fly-read .timing { background:var(--block); border-left:3px solid var(--kuka); border-radius:8px; padding:16px 18px; font-size:14px; line-height:1.55; }
.fly-read .timing b { color:var(--kuka); }

/* ============================================================
   SCREEN 10 — ask + why me (dark close)
   ============================================================ */
.close-wrap { position:relative; z-index:3; }
#close-stage { position:absolute; inset:0; z-index:1; pointer-events:none; }
.ask-grid { display:grid; grid-template-columns:1fr 1fr; gap:40px; margin-top:30px; }
.ask-col h3 { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--kuka); margin-bottom:16px; }
.ask-col ul { list-style:none; }
.ask-col li { font-size:15px; line-height:1.55; margin-bottom:12px; padding-left:18px; position:relative; color:var(--dark-ink); }
.ask-col li::before { content:"→"; position:absolute; left:0; color:var(--kuka); }
.midea-note { font-size:13px; color:var(--dark-sec); font-style:italic; margin-top:24px; line-height:1.5; max-width:60ch; }
.whyme { margin-top:30px; font-family:'Space Grotesk',sans-serif; font-size:clamp(16px,2vw,24px); line-height:1.4; color:var(--dark-ink); }
.whyme b { color:var(--kuka); }

/* signature block */
.sig-block { margin-top:auto; padding-top:30px; }
.sig-name { font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:16px; }
.sig-cred { font-size:12.5px; color:var(--secondary); margin-top:3px; }
.dark .sig-cred { color:var(--dark-sec); }

/* reduced motion */
@media (prefers-reduced-motion: reduce) {
  .step, .node, .fly-node, .fly-center { transition:none !important; }
  * { animation-duration:.001s !important; }
}

/* responsive */
@media (max-width:900px) {
  .sig-grid { grid-template-columns:1fr 1fr; }
  .map-wrap, .layers, .fly-wrap, .diag, .ask-grid { grid-template-columns:1fr; gap:24px; }
  .paradox { grid-template-columns:1fr; }
  .paradox .right { border-left:none; border-top:1px solid var(--border); }
  .swot { grid-template-rows:auto; }
  #fly-stage { max-width:340px; }
}
</style>
</head>
<body data-theme="A">

<div id="themebar">
  <span class="lab">Theme</span>
  <button data-t="A" class="on">A</button>
  <button data-t="B">B</button>
  <button data-t="C">C</button>
</div>

<div id="deck"></div>

<div id="rail"></div>
<div id="counter"></div>
<div id="hint">← → to navigate</div>

<script>
/* ============================================================
   SCREEN DEFINITIONS
   ============================================================ */
const SCREENS = [

/* ---- 1 · COVER ---------------------------------------------------- */
{
  id:"cover", dark:true, steps:0,
  html:`
    <div class="grid-bg"></div>
    <div id="arm-stage">
      <svg viewBox="0 0 900 600" preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%">
        <defs>
          <linearGradient id="armgrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#FF7A2E"/><stop offset="1" stop-color="#E24E00"/>
          </linearGradient>
          <filter id="softglow"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        <!-- base -->
        <g id="arm-base" opacity="0">
          <rect x="120" y="470" width="120" height="26" rx="6" fill="url(#armgrad)"/>
          <rect x="150" y="420" width="60" height="60" rx="8" fill="url(#armgrad)"/>
        </g>
        <!-- link1 -->
        <g id="arm-l1" opacity="0" style="transform-origin:180px 450px">
          <rect x="168" y="300" width="24" height="150" rx="10" fill="url(#armgrad)"/>
          <circle cx="180" cy="300" r="16" fill="#0A0A0B" stroke="url(#armgrad)" stroke-width="5"/>
        </g>
        <!-- link2 -->
        <g id="arm-l2" opacity="0" style="transform-origin:180px 300px">
          <rect x="180" y="196" width="220" height="22" rx="10" fill="url(#armgrad)"/>
          <circle cx="392" cy="207" r="14" fill="#0A0A0B" stroke="url(#armgrad)" stroke-width="5"/>
        </g>
        <!-- link3 / wrist -->
        <g id="arm-l3" opacity="0" style="transform-origin:392px 207px">
          <rect x="392" y="150" width="120" height="18" rx="9" fill="url(#armgrad)"/>
          <circle cx="512" cy="159" r="11" fill="#0A0A0B" stroke="url(#armgrad)" stroke-width="4"/>
          <rect x="512" y="150" width="34" height="18" rx="5" fill="url(#armgrad)"/>
        </g>
        <!-- trajectory -->
        <path id="traj" d="M548 159 C 640 150, 690 210, 760 190" fill="none" stroke="var(--kuka)" stroke-width="3" stroke-linecap="round" filter="url(#softglow)" stroke-dasharray="400" stroke-dashoffset="400"/>
        <circle id="traj-end" cx="760" cy="190" r="5" fill="var(--kuka)" opacity="0" filter="url(#softglow)"/>
      </svg>
    </div>
    <div class="cover-wrap"><div class="cover-text">
      <div class="kicker" id="cv-kick"><span class="bar">■</span>&nbsp; CONFIDENTIAL · STRATEGIC SYNOPSIS · 2026</div>
      <h1 class="title" style="max-width:16ch">KUKA at the Physical-AI Inflection</h1>
      <p class="subtitle" style="color:var(--dark-sec)">A global synopsis — and a proposition from India.</p>
      <div class="sig-block" style="margin-top:44px;padding-top:0">
        <div class="sig-name" style="color:var(--dark-ink)">[ YOUR NAME ]</div>
        <div class="sig-cred">[ one-line credential — e.g. PhD Robotics · 16 yrs robotics &amp; AI · Head of Engineering &amp; Product, physical-AI ]</div>
      </div>
    </div></div>`,
  enter(el, ctx){
    if(ctx.reduced){
      ['arm-base','arm-l1','arm-l2','arm-l3'].forEach(id=>el.querySelector('#'+id).style.opacity=1);
      const t=el.querySelector('#traj'); t.style.strokeDashoffset=0;
      el.querySelector('#traj-end').style.opacity=1;
      el.querySelector('#cv-kick').style.opacity=1; el.querySelector('#cv-kick').style.transform='none';
      return;
    }

/* ============================================================
   ENGINE
   ============================================================ */
const deck=document.getElementById('deck');
const rail=document.getElementById('rail');
const counter=document.getElementById('counter');
const hint=document.getElementById('hint');
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let cur=0, stepIdx=0;
const els=[];

SCREENS.forEach((s,idx)=>{
  const d=document.createElement('section');
  d.className='screen'+(s.dark?' dark':'');
  d.innerHTML=s.html;
  deck.appendChild(d);
  els.push(d);
  const dot=document.createElement('div');
  dot.className='dot'; dot.onclick=()=>goto(idx);
  rail.appendChild(dot);
});

function countUp(node){
  const target=parseFloat(node.dataset.count);
  const pre=node.dataset.pre||''; const suf=node.dataset.suf||'';
  const dec=(node.dataset.count.split('.')[1]||'').length;
  const dur=900; const t0=performance.now();
  function tick(t){
    const p=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-p,3);
    let v=(target*e).toFixed(dec);
    if(target>=1000) v=Math.round(target*e).toLocaleString();
    node.textContent=pre+v+suf;
    if(p<1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
window.countUp=countUp;

function showStepsUpTo(el, n){
  const steps=el.querySelectorAll('.step');
  steps.forEach((s,i)=>{ if(i<n) s.classList.add('shown'); else s.classList.remove('shown'); });
}

function enter(idx){
  const el=els[idx], s=SCREENS[idx];
  document.body.classList.toggle('on-dark', !!s.dark);
  // reset custom
  if(s.reset) s.reset(el);
  showStepsUpTo(el, 0);
  stepIdx=0;
  if(s.enter) s.enter(el,{reduced});
  // if reduced motion, reveal all steps immediately
  if(reduced && s.steps){ for(let k=1;k<=s.steps;k++){ revealStep(true); } stepIdx=s.steps; }
  updateChrome();
}

function revealStep(silent){
  const el=els[cur], s=SCREENS[cur];
  if(stepIdx>=s.steps) return false;
  stepIdx++;
  showStepsUpTo(el, stepIdx);
  if(s.step) s.step(el, stepIdx);
  if(!silent) updateChrome();
  return true;
}
function hideStep(){
  const el=els[cur], s=SCREENS[cur];
  if(stepIdx<=0) return false;
  stepIdx--;
  showStepsUpTo(el, stepIdx);
  if(s.reset && stepIdx===0) s.reset(el);
  else if(s.step){ // re-run custom reveals up to current
    if(s.reset) s.reset(el);
    for(let k=1;k<=stepIdx;k++){ showStepsUpTo(el,k); s.step(el,k); }
  }
  updateChrome();
  return true;
}

function next(){
  if(revealStep()) return;
  if(cur<SCREENS.length-1) goto(cur+1);
}
function prev(){
  if(stepIdx>0 && !reduced){ if(hideStep()) return; }
  if(cur>0) goto(cur-1, true);
}

function goto(idx, atEnd){
  if(idx===cur){ return; }
  els[cur].classList.remove('active');
  cur=idx;
  els[cur].classList.add('active');
  enter(cur);
  if(atEnd){ const s=SCREENS[cur]; for(let k=0;k<s.steps;k++) revealStep(true); stepIdx=s.steps; updateChrome(); }
}

function updateChrome(){
  [...rail.children].forEach((d,i)=>d.classList.toggle('on', i===cur));
  counter.textContent=String(cur+1).padStart(2,'0')+' / '+String(SCREENS.length).padStart(2,'0');
}

// keyboard
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){ e.preventDefault(); next(); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); prev(); }
  else if(e.key==='Home'){ goto(0); }
  else if(e.key==='End'){ goto(SCREENS.length-1,true); }
});
// click right/left half (mobile / trackpad)
deck.addEventListener('click',e=>{
  if(e.target.closest('#themebar')) return;
  const x=e.clientX/window.innerWidth;
  if(x>0.5) next(); else prev();
});
// hide hint after a bit
setTimeout(()=>{ hint.style.opacity=0; }, 4200);

// theme switch
document.querySelectorAll('#themebar button').forEach(b=>{
  b.onclick=(e)=>{ e.stopPropagation();
    document.body.dataset.theme=b.dataset.t;
    document.querySelectorAll('#themebar button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
  };
});

// init
els[0].classList.add('active');
enter(0);
</script>
</body>
</html>
